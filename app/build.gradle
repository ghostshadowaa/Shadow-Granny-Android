plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shadow.granny'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shadow.granny'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-23', 'APP_ABI=arm64-v8a', 'APP_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('../jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
